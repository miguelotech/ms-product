plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.sonarqube' version '4.4.1.3373'
	id 'org.openapi.generator' version '7.10.0'
}

group = 'com.synopsis.product'
version = '1.0'
description = 'microservicio para productos'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.6.0'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
	compileOnly 'org.projectlombok:lombok'
    compileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'
	runtimeOnly 'io.r2dbc:r2dbc-h2:1.0.0.RELEASE'
	annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

jacoco {
	toolVersion = '0.8.11'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy(tasks.named('jacocoTestReport'))
}

sourceSets {
    main {
        java {
            srcDir("$buildDir/generated/openapi/src/main/java")
        }
    }
}

tasks.named('compileJava') {
    dependsOn(tasks.named('openApiGenerate'))
}

tasks.named('compileTestJava') {
    dependsOn(tasks.named('openApiGenerate'))
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/resources/openapi/product-api.yaml"
    outputDir = "$buildDir/generated/openapi"
    modelPackage = "com.synopsis.product.openapi.dto"
    invokerPackage = "com.synopsis.product.openapi"
    configOptions = [
            dateLibrary       : "java8",
            useSpringBoot3    : "true",
            useJakartaEe      : "true",
            useBeanValidation : "true",
            serializableModel : "true",
            sourceFolder      : "src/main/java"
    ]
    typeMappings = [
            "DateTime": "java.time.LocalDateTime"
    ]
    importMappings = [
            "LocalDateTime": "java.time.LocalDateTime"
    ]
    globalProperties = [
            models    : "",
            modelDocs : "false",
            modelTests: "false"
    ]
}

tasks.named('jacocoTestReport', org.gradle.testing.jacoco.tasks.JacocoReport) {
	dependsOn(tasks.named('test'))
	reports {
		xml.required = true
		csv.required = false
		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
	}
}

sonarqube {
	properties {
		property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY') ?: 'miguelotech_ms-product'
		property 'sonar.organization', System.getenv('SONAR_ORGANIZATION') ?: 'miguelotech'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.sources', 'src/main/java'
		property 'sonar.tests', 'src/test/java'
		property 'sonar.java.binaries', layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath
		property 'sonar.coverage.jacoco.xmlReportPaths', layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath
	}
}
